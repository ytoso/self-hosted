server {
    listen 80;

    # Docker's embedded DNS. Without a resolver nginx resolves the upstream
    # once at startup and caches it forever; if that IP becomes stale (e.g. a
    # proxy/VPN fake-ip changes), nginx keeps proxying to a dead/wrong server
    # and returns 404/502 even though the container is up.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    location = /rss {
        # Using a variable in proxy_pass forces nginx to re-resolve the host
        # at request time using the resolver above instead of caching at boot.
        set $mistral_host mistral.ai;
        proxy_pass https://$mistral_host/news/rss;

        proxy_ssl_server_name on;
        proxy_ssl_name mistral.ai;
        proxy_set_header Host mistral.ai;

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_hide_header Content-Type;
        add_header Content-Type "application/rss+xml; charset=UTF-8" always;
    }
}
