name: yutong

services:
    rsshub:
        # two ways to enable Playwright:
        # * comment out marked lines, then use this image instead: diygod/rsshub:chromium-bundled
        # * (consumes more disk space and memory) leave everything unchanged
        image: diygod/rsshub # or ghcr.io/diygod/rsshub
        restart: always
        ports:
            - '1200:1200'
        environment:
            NODE_ENV: production
            CACHE_TYPE: redis
            REDIS_URL: 'redis://redis:6379/'
            PLAYWRIGHT_CDP_ENDPOINT: 'ws://browserless:3000?token=${BROWSERLESS_TOKEN:-rsshub}' # marked
            # Credentials live in .env (git-ignored). See .env.example.
            TWITTER_USERNAME: '${TWITTER_USERNAME:-}'
            TWITTER_PASSWORD: '${TWITTER_PASSWORD:-}'
            TWITTER_AUTH_TOKEN: '${TWITTER_AUTH_TOKEN:-}'
            INSTAGRAM_COOKIE: '${INSTAGRAM_COOKIE:-}'
            YOUTUBE_KEY: '${YOUTUBE_KEY:-}'
            GITHUB_ACCESS_TOKEN: '${GITHUB_ACCESS_TOKEN:-}'
            ZHIHU_COOKIES: '${ZHIHU_COOKIES:-}'
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:1200/healthz']
            interval: 30s
            timeout: 10s
            retries: 3
        depends_on:
            - redis
            - browserless # marked

    browserless: # marked
        image: ghcr.io/browserless/chromium # marked
        restart: always # marked
        environment: # marked
            TOKEN: '${BROWSERLESS_TOKEN:-rsshub}' # marked
        ulimits: # marked
            core: # marked
                hard: 0 # marked
                soft: 0 # marked
        healthcheck: # marked
            test: ['CMD-SHELL', 'curl -f "http://localhost:3000/pressure?token=$$TOKEN"'] # marked
            interval: 30s # marked
            timeout: 10s # marked
            retries: 3 # marked

    redis:
        image: redis:alpine
        restart: always
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 5s

    freshrss:
      image: freshrss/freshrss:latest
      container_name: freshrss
      restart: unless-stopped

      logging:
        options:
          max-size: 10m

      ports:
        - "127.0.0.1:8080:80"

      volumes:
        - freshrss_data:/var/www/FreshRSS/data
        - freshrss_extensions:/var/www/FreshRSS/extensions

    mistral-proxy:
      # Built from ./mistral-proxy so the nginx config is part of the image
      # instead of being bind-mounted from a Windows path. See
      # mistral-proxy/Dockerfile for the full story.
      build: ./mistral-proxy
      image: yutong/mistral-proxy:local
      restart: always
      environment:
        TZ: Asia/Tokyo

volumes:
    redis-data:
    freshrss_data:
    freshrss_extensions:
